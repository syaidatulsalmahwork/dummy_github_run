# Dummy only. Runs sample-math.py (same as HELLO), then overwrites
# issue #14 last-math-result so Studio Compose can read the prints.

name: Run sample math

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-math]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sample-math.py and post prints to issue 14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "----- prints -----"
          python sample-math.py > result.txt 2>&1 || true
          cat result.txt
          gh issue edit 14 --body-file result.txt
