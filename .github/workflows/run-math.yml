# Dummy only. Same idea as the HELLO ping: GitHub already has the file.
# Actions → Run workflow, or Studio "Create a repository dispatch event"
# with Event Name: run-math

name: Run sample math

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-math]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sample-math.py
        run: |
          echo "----- prints -----"
          python sample-math.py
