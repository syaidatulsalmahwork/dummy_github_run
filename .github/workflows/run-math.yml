# Dummy only. Any new issue on this repo is treated as a Python script.
# Studio Create-an-issue sends the script. This job saves math.py, runs it,
# and writes ===RESULTS=== back onto the same issue for Studio to read.

name: Run math from issue

on:
  issues:
    types: [opened]

jobs:
  run-math:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save issue body as math.py
        env:
          CODE: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          raw = os.environ.get("CODE") or ""
          match = re.search(r"```(?:python)?\s*([\s\S]*?)```", raw, re.I)
          code = (match.group(1) if match else raw).strip()
          pathlib.Path("math.py").write_text(code + "\n", encoding="utf-8")
          print("Wrote math.py, chars:", len(code))
          PY

      - name: Commit math.py to the repo
        run: |
          git config user.name "studio-dummy"
          git config user.email "studio-dummy@users.noreply.github.com"
          git add math.py
          if git diff --cached --quiet; then
            echo "math.py unchanged"
          else
            git commit -m "math.py from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Run math.py
        run: |
          python math.py > result.txt 2>&1 || true
          cat result.txt

      - name: Write stdout back onto the issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = '(no result.txt — python did not produce output)';
            if (fs.existsSync('result.txt')) {
              result = fs.readFileSync('result.txt', 'utf8');
            }
            const original = context.payload.issue.body || '';
            const stripped = original.replace(/\n===RESULTS===[\s\S]*$/, '');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: stripped + '\n\n===RESULTS===\n```\n' + result.trim() + '\n```\n',
            });
